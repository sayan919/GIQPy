<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- ===== arrows (behind boxes) ===== -->
  <g stroke="#64748B" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <!-- spine (equal length = 60) -->
    <line x1="230" y1="215" x2="290" y2="215"/>
    <line x1="480" y1="215" x2="540" y2="215"/>
    <line x1="730" y1="215" x2="790" y2="215"/>
    <!-- input drops (equal length = 76) -->
    <line x1="135" y1="102" x2="135" y2="178"/>
    <line x1="635" y1="102" x2="635" y2="178"/>
    <!-- shared system_info.json -> both scripts (symmetric) -->
    <line x1="330" y1="102" x2="175" y2="178"/>
    <line x1="440" y1="102" x2="595" y2="178"/>
  </g>
  <!-- optional downstream use (dashed) -->
  <g stroke="#94A3B8" stroke-width="2.2" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow)">
    <line x1="385" y1="252" x2="385" y2="328"/>
  </g>
  <text x="402" y="294" font-size="13" fill="#111111">also usable by</text>

  <!-- ===== INPUTS: light "file" boxes (blue) ===== -->
  <g>
    <rect x="40" y="38" width="190" height="64" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="135" y="63" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1E3A8A" font-weight="600">Trajectory XYZ</text>
    <text x="135" y="83" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#64748B" font-style="italic">MD frames</text>
  </g>
  <g>
    <rect x="290" y="38" width="190" height="64" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="385" y="63" text-anchor="middle" dominant-baseline="central" font-size="13.5" fill="#1E3A8A" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">system_info.json</text>
    <text x="385" y="83" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#64748B" font-style="italic">monomers + solvent</text>
  </g>
  <g>
    <rect x="540" y="38" width="190" height="64" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="635" y="63" text-anchor="middle" dominant-baseline="central" font-size="13.5" fill="#1E3A8A" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">keywords.txt</text>
    <text x="635" y="83" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#64748B" font-style="italic">Gaussian route</text>
  </g>

  <!-- ===== SCRIPTS: solid "step" boxes (indigo, white text) ===== -->
  <g>
    <rect x="40" y="178" width="190" height="74" rx="12" fill="#6366F1" stroke="#4338CA" stroke-width="2"/>
    <text x="135" y="206" text-anchor="middle" dominant-baseline="central" font-size="15.5" fill="#FFFFFF" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">giqpy.py</text>
    <text x="135" y="227" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#C7D2FE" font-weight="600">STAGE 1 · geometry</text>
  </g>
  <g>
    <rect x="540" y="178" width="190" height="74" rx="12" fill="#6366F1" stroke="#4338CA" stroke-width="2"/>
    <text x="635" y="206" text-anchor="middle" dominant-baseline="central" font-size="13.5" fill="#FFFFFF" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">xyz-to-gaussian.py</text>
    <text x="635" y="227" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#C7D2FE" font-weight="600">STAGE 2 · Gaussian</text>
  </g>

  <!-- ===== OUTPUTS: green "folder" boxes (with tab) ===== -->
  <g>
    <rect x="308" y="170" width="58" height="14" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <rect x="290" y="178" width="190" height="74" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="385" y="206" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#065F46" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">coordinates/</text>
    <text x="385" y="227" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#047857">QM + MM .xyz · per frame</text>
  </g>
  <g>
    <rect x="808" y="170" width="58" height="14" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <rect x="790" y="178" width="190" height="74" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="885" y="206" text-anchor="middle" dominant-baseline="central" font-size="14.5" fill="#065F46" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gaussian-inputs/</text>
    <text x="885" y="227" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#047857">.com inputs · per frame</text>
  </g>

  <!-- ===== optional downstream box (gray, dashed) ===== -->
  <g>
    <rect x="290" y="328" width="190" height="64" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="385" y="353" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#475569" font-weight="600">TeraChem / other</text>
    <text x="385" y="373" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#475569" font-weight="600">QM packages</text>
  </g>

</svg>
